name: http_cats_app
description: "A portfolio Flutter app built on top of the http.cat status image catalog."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.0
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.0.3
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  injectable: ^2.5.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shimmer: ^3.0.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ">=2.34.0 <2.34.1+1"
